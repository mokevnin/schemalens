[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
goreleaser = "2.18.3"

[tasks.build]
description = "Build the schemalens binary into ./bin"
run = "go build -o bin/schemalens ./cmd/schemalens"

[tasks.test]
description = "Run all tests, including golden tests, in every workspace module"
run = "for d in $(find . -name go.mod -not -path '*/testdata/*' -not -path './.claude/*' | xargs -n1 dirname); do (cd $d && go test ./...) || exit 1; done"

[tasks.golden]
description = "Rewrite golden files; review the diff before committing"
run = "go test ./internal/cli -update"

[tasks.docs]
description = "Regenerate docs/rules from the rule registry"
run = "go run ./tools/ruledocs"

[tasks.lint]
description = "Run golangci-lint in every workspace module"
run = "for d in $(find . -name go.mod -not -path '*/testdata/*' -not -path './.claude/*' | xargs -n1 dirname); do (cd $d && golangci-lint run ./...) || exit 1; done"

[tasks.release-snapshot]
description = "Build every release archive locally without publishing (goreleaser snapshot into ./dist)"
run = "goreleaser release --snapshot --clean"

[tasks.check]
description = "Everything CI runs"
depends = ["lint", "test"]
